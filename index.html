<title>(株)宣伝週報ダッシュボード｜ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#EEF2F7;--card:#FFFFFF;--fg:#1B2430;--muted:#5B6573;--line:#C9D1DB;--brand:#1F63B8;--brand-dark:#174C8C;--bad:#C8382E;--jp:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic UI",sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#101317;--card:#1A1E23;--fg:#E8EAED;--muted:#A3ABB5;--line:#3A414A;--brand:#4E8FE0;--brand-dark:#3B7BCC;--bad:#F0786E}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--jp)}
body{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.band{background:linear-gradient(118deg,#14206B 0%,#1B3593 38%,#0A5FB4 72%,#0B82CF 100%);color:#FFFFFF;padding:40px 20px 92px;text-align:center}
.band .logo{display:inline-block;background:#FFFFFF;border-radius:12px;padding:8px 14px;box-shadow:0 6px 20px rgba(5,20,70,.25)}
.band .logo img{display:block;height:44px;width:auto}
.band .en{margin:18px 0 6px;font-size:12px;font-weight:700;letter-spacing:.28em;color:#A9D4F5}
.band h1{margin:0;font-size:clamp(22px,5.4vw,32px);font-weight:700;line-height:1.35;word-break:auto-phrase}
main{display:flex;justify-content:center;padding:0 16px}
form{width:100%;max-width:400px;margin-top:-60px;align-self:start;background:var(--card);border-radius:16px;padding:28px 24px 24px;box-shadow:0 10px 30px rgba(20,32,60,.12);display:grid;gap:16px}
form h2{margin:0;font-size:19px;font-weight:700}
form p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
label{font-size:14px;font-weight:700}
.field{display:grid;gap:6px}
.pw{display:flex;border:1.5px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.pw:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.pw input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;padding:12px 14px;min-height:50px}
.pw button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:0 14px;cursor:pointer;min-width:64px}
.keep{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;min-height:44px;cursor:pointer}
.keep input{width:20px;height:20px;accent-color:var(--brand);margin:0}
.go{min-height:52px;border:0;border-radius:10px;background:var(--brand);color:#FFFFFF;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.go:hover{background:var(--brand-dark)}
.go:disabled{opacity:.7;cursor:wait}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.err{min-height:1.4em;margin:-6px 0 0;font-size:14px;font-weight:700;color:var(--bad)}
footer{padding:28px 16px;text-align:center;font-size:12px;color:var(--muted)}
.wait{display:none;position:fixed;inset:0;place-items:center;background:var(--bg);font-size:15px;color:var(--muted)}
.opening .wait{display:grid}
</style>
</head>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = 'senden-key';
async function keyFromPw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
async function saved() {
  let raw = null;
  try { raw = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return false;
  try {
    const { salt, k } = JSON.parse(raw);
    if (salt !== P.salt) throw 0;
    const key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    document.body.classList.add('opening');
    await open(key); return true;
  } catch (e) {
    document.body.classList.remove('opening');
    try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (x) {}
    return false;
  }
}
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
document.getElementById('eye').addEventListener('click', (e) => {
  const show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
  e.currentTarget.textContent = show ? '隠す' : '表示'; e.currentTarget.setAttribute('aria-pressed', String(show));
});
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '確認しています…';
  try {
    const key = await keyFromPw(pw.value.trim());
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    const k = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
    const v = JSON.stringify({ salt: P.salt, k });
    try { (document.getElementById('keep').checked ? localStorage : sessionStorage).setItem(KEY, v); } catch (x) {}
    document.body.classList.add('opening');
    await open(key);
  } catch (x) {
    err.textContent = 'パスワードが違います。もう一度入力してください。';
    go.disabled = false; go.textContent = 'ログイン'; pw.select();
  }
});
saved();
</script>
